<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotações</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F4E79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cotações">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{--az:#1F4E79;--az2:#163a5a;--bg:#F4F7FA;--tx:#101820;--mut:#4a5a6a;--bd:#8fa6bd;--er:#a3201a;--am:#FFF4D6;--ok:#E6F4EA;--fs:20px}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.35}
#app{max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--az);color:#fff;padding:.55rem 1rem;padding-top:calc(.55rem + env(safe-area-inset-top));position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;gap:.6rem}
header .logo{height:2.6rem;width:auto;background:#fff;border-radius:10px;padding:.15rem .4rem}
header h1{font-size:1.15rem;margin:0;flex:1}
.aa{background:#fff;color:var(--az);border:0;border-radius:.6rem;font-size:1rem;font-weight:700;padding:.35rem .7rem;min-height:2.4rem;cursor:pointer}
#prog{display:none;margin-top:.45rem}
#prog .t{font-size:.85rem;opacity:.95}
#prog .b{height:.45rem;background:rgba(255,255,255,.3);border-radius:1rem;margin-top:.25rem;overflow:hidden}
#prog .b i{display:block;height:100%;background:#fff;width:0}
main{flex:1;padding:1rem 1rem 9rem}
h2{font-size:1.35rem;margin:.2rem 0 .7rem;line-height:1.2}
h3{font-size:1.1rem;margin:1rem 0 .4rem}
p{margin:.4rem 0}
.muted{color:var(--mut);font-size:.9rem}
label{display:block;font-weight:700;margin:.9rem 0 .3rem}
input,textarea,select{width:100%;font:inherit;font-size:1.1rem;padding:.7rem .8rem;border:2px solid var(--bd);border-radius:.7rem;background:#fff;color:var(--tx);min-height:3.2rem}
input:focus,textarea:focus,select:focus{outline:3px solid #7fb0e0;border-color:var(--az)}
textarea{resize:vertical}
.btn{display:block;width:100%;min-height:3.4rem;font:inherit;font-size:1.05rem;font-weight:700;border-radius:.8rem;border:2px solid var(--az);background:#fff;color:var(--az);padding:.6rem 1rem;margin:.55rem 0;text-align:left;cursor:pointer}
.btn small{display:block;font-weight:400;font-size:.85rem;color:inherit;opacity:.85;margin-top:.1rem}
.btn.pri{background:var(--az);color:#fff}
.btn.danger{border-color:var(--er);color:var(--er)}
.btn.sm{min-height:2.7rem;font-size:.95rem;margin:.3rem 0;text-align:center}
.btn.sel{background:#DCEBFA;border-width:3px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:active{filter:brightness(.92)}
.row{display:flex;gap:.6rem}
.row>*{flex:1}
.card{background:#fff;border:2px solid #cfdbe7;border-radius:.8rem;padding:.7rem .8rem;margin:.6rem 0}
.card b{display:block}
.tot{font-weight:800;font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
.chip{border:2px solid var(--az);background:#fff;color:var(--az);border-radius:2rem;padding:.45rem .9rem;font:inherit;font-size:.95rem;font-weight:600;min-height:2.6rem;cursor:pointer}
.note{background:var(--am);border:2px solid #e8c766;border-radius:.8rem;padding:.7rem .8rem;margin:.7rem 0;font-size:.95rem}
.ok{background:var(--ok);border:2px solid #86c79a;border-radius:.8rem;padding:.7rem .8rem;margin:.7rem 0}
.sum{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;margin:.4rem 0}
.sum dt{color:var(--mut);font-size:.9rem}
.sum dd{margin:0;font-weight:700}
.sec{margin:.8rem 0;padding:.6rem .8rem;background:#fff;border:2px solid #cfdbe7;border-radius:.8rem}
.sec .h{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.sec .h b{font-size:1.02rem}
.alt{background:none;border:2px solid var(--az);color:var(--az);border-radius:.6rem;font:inherit;font-size:.9rem;font-weight:700;padding:.3rem .8rem;min-height:2.4rem;cursor:pointer}
#navwrap{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:2px solid var(--bd);padding:.5rem 1rem calc(.5rem + env(safe-area-inset-bottom))}
#navin{max-width:720px;margin:0 auto}
#hint{color:var(--er);font-weight:600;font-size:.9rem;min-height:0;margin:0 0 .2rem}
#nav{display:flex;gap:.6rem}
#nav .btn{margin:0;text-align:center;flex:1}
#toast{position:fixed;left:1rem;right:1rem;margin:0 auto;width:fit-content;max-width:calc(100% - 2rem);bottom:8.5rem;background:#222;color:#fff;padding:.7rem 1rem;border-radius:.8rem;z-index:9;font-size:.95rem;display:none;text-align:center}
.pillrow{display:flex;align-items:center;gap:.6rem}
.pillrow .btn{width:3.4rem;flex:none;text-align:center;font-size:1.5rem;padding:0}
.pillrow .v{flex:1;text-align:center;font-weight:800;font-size:1.15rem}
.right{text-align:right}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow"><h1 id="title">Cotações</h1><img class="logo" src="logo.png" alt="Ataide Com. Adesivos"></div>
    <div id="prog"><div class="t" id="progt"></div><div class="b"><i id="progb"></i></div></div>
  </header>
  <main id="view"></main>
  <div id="navwrap"><div id="navin"><div id="hint"></div><div id="nav"></div></div></div>
  <div id="toast"></div>
</div>
<input type="file" id="filepick" accept=".json,application/json" style="display:none">
<script src="lib/jspdf.umd.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const up = s => String(s == null ? '' : s).trim().toUpperCase();
const pad2 = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const NUM = ['', 'UM', 'DOIS', 'TRÊS', 'QUATRO', 'CINCO', 'SEIS', 'SETE', 'OITO', 'NOVE', 'DEZ'];

const fmt = c => {
  c = Math.round(Math.abs(c)) * (c < 0 ? -1 : 1);
  const neg = c < 0; c = Math.abs(c);
  const r = Math.floor(c / 100), d = String(c % 100).padStart(2, '0');
  return (neg ? '-' : '') + String(r).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d;
};
const brl = c => 'R$ ' + fmt(c);
const isUsd = q => q && q.moeda === 'USD';
const sym = q => isUsd(q) ? 'US$' : 'R$';
const money = (q, c) => sym(q) + ' ' + fmt(c);
const rateOf = q => { const v = parseBR(q.ptaxTxt != null && q.ptaxTxt !== '' ? q.ptaxTxt : q.ptax); return v > 0 ? v : NaN; };
const toBrl = (q, c) => isUsd(q) ? Math.round(c * rateOf(q)) : c;
const CLI_KEYS = ['end', 'cep', 'cidade', 'uf', 'pais', 'fone', 'doc', 'email'];
const CLI_LBL = { end: 'Rua e número', cep: 'CEP', cidade: 'Cidade', uf: 'UF', pais: 'País', fone: 'Telefone', doc: 'CPF/CNPJ', email: 'E-mail' };
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();
function parseBR(s) {
  s = String(s == null ? '' : s).trim().replace(/R\$|\s/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
const toCents = s => { const v = parseBR(s); return isNaN(v) ? NaN : Math.round(v * 100); };
const qtdStr = q => Number.isInteger(+q) ? pad2(+q) : String(+q).replace('.', ',');
const lineCents = it => Math.round((+it.qtd) * (+it.unit));
const totalCents = q => (q.itens || []).reduce((a, it) => a + lineCents(it), 0);
const finalCents = q => (q.especial != null ? q.especial : totalCents(q));

const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate()); };
const br = iso => { const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; };
const validISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(Date.parse(s));
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 30).replace(/_+$/g, '');
const numTxt = q => String(q.numero) + '/' + q.ano;

/* ---------- armazenamento (no aparelho) ---------- */
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); if (v !== null) return JSON.parse(v); } catch (e) {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const DEF = { settings: { fone1: '', fone2: '', banco: '', agencia: '', conta: '', doc: '', titular: '', assinatura: '', validade: 14 },
  counters: {}, clients: [], catalog: [], history: [], ui: { fs: 1 } };
function normDB(x) {
  const d = Object.assign({}, DEF, x || {});
  d.settings = Object.assign({}, DEF.settings, d.settings || {});
  d.ui = Object.assign({ fs: 1 }, d.ui || {});
  ['clients', 'catalog', 'history'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  if (!d.counters || typeof d.counters !== 'object') d.counters = {};
  return d;
}
let DB = normDB(store.get('cot_db', {}));
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 3000); }
const saveDB = () => { if (!store.set('cot_db', DB)) toast('Atenção: não foi possível salvar neste aparelho. Faça um backup.'); };

/* ---------- cotação em andamento ---------- */
const blankQuote = () => ({ id: uid(), numero: null, ano: null, data: todayISO(), dias: +DB.settings.validade || 14,
  cliente: '', att: '', aeronave: '', moeda: 'BRL', ptaxTxt: '', ptaxInfo: '', cli: {}, itens: [], especial: null, espOn: false, espTxt: '',
  entrega: { tipo: '', dest: '', transp: '', envios: 1, fretePago: true, outro: '' }, _step: 'cliente' });
let Q = store.get('cot_draft', null);
const saveDraft = () => { if (Q) store.set('cot_draft', Q); };
const clearDraft = () => { Q = null; store.set('cot_draft', null); };

/* ---------- textos de entrega ---------- */
function entregaTexts(e) {
  let prazo = '', dep = 'TOTAL DEPÓSITO';
  const D = up(e.dest), T = up(e.transp);
  switch (e.tipo) {
    case 'imediato': prazo = 'IMEDIATO'; break;
    case 'entregue': prazo = 'MATERIAL JÁ ENTREGUE'; break;
    case 'sedex': {
      const n = Math.max(1, parseInt(e.envios, 10) || 1);
      prazo = n > 1 ? `${NUM[n] || n} (${pad2(n)}) SEDEX ENVIADO PARA ${D}` : `MATERIAL ENVIADO VIA SEDEX PARA ${D}`;
      if (e.fretePago) dep = 'TOTAL DEPÓSITO COM SEDEX PAGO';
      break; }
    case 'transp':
      prazo = `MATERIAL ENVIADO VIA ${T}` + (D ? ` PARA ${D}` : '');
      if (e.fretePago) dep = 'TOTAL DEPÓSITO COM FRETE PAGO';
      break;
    case 'outro': prazo = up(e.outro); break;
  }
  return { prazo, dep };
}

/* ---------- gerador de PDF ---------- */
let HDR = null;
async function headerData() {
  if (HDR) return HDR;
  try {
    const r = await fetch('header.jpg'); const b = await r.blob();
    HDR = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
  } catch (e) { HDR = ''; }
  return HDR;
}
async function buildPdf(q) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const S = DB.settings, LH = 11.8, L = 53, R = 538;
  let y = 0;
  const font = b => doc.setFont('helvetica', b ? 'bolditalic' : 'italic');
  const T = (t, x, yy, o = {}) => { font(o.b); doc.setFontSize(o.s || 9); doc.text(t, x, yy, { align: o.al || 'left', lineHeightFactor: LH / (o.s || 9) }); };

  const hdr = await headerData();
  if (hdr) doc.addImage(hdr, 'JPEG', 90, 34, 415, 415 * 177 / 947);
  T(br(q.data), 297.6, 147, { b: 1, al: 'center' });
  y = 171;
  T(up(q.cliente), L, y, { b: 1 });
  let last = y;
  if (up(q.att)) { y += 12; T('ATT. ' + up(q.att), L, y, { b: 1 }); last = y; }
  if (up(q.aeronave)) { y += 12; T(up(q.aeronave), 297.6, y, { b: 1, al: 'center' }); last = y; }
  y = Math.max(198, last + 15);
  T('COTAÇÃO:' + numTxt(q), L, y, { b: 1 });
  y += 12; T('CONFORME SUA SOLICITAÇÃO ESTAMOS COTANDO MATERIAL ABAIXO:', L, y);
  y += 27;

  const head = () => {
    T('QUANT.', 102, y, { b: 1, al: 'center' }); T('P/N', 153, y, { b: 1, al: 'center' });
    T('NOME', 293, y, { b: 1, al: 'center' }); T('VLR. UNIT.', 404, y, { b: 1, al: 'center' });
    T('TOTAL', 522, y, { b: 1, al: 'center' }); y += 13;
  };
  head();
  font(false); doc.setFontSize(9);
  for (const it of q.itens) {
    const nm = doc.splitTextToSize(up(it.nome), 148), pn = doc.splitTextToSize(up(it.pn), 82);
    const n = Math.max(nm.length, pn.length, 1);
    if (y + n * LH > 790) { doc.addPage(); y = 55; head(); }
    T(qtdStr(it.qtd), 111, y, { al: 'right' });
    T(pn, 137, y); T(nm, 223, y);
    T(fmt(it.unit), 429, y, { al: 'right' }); T(fmt(lineCents(it)), R, y, { al: 'right' });
    y += n * LH;
  }
  if (y > 470) { doc.addPage(); y = 55; }
  const arrow = yy => { doc.setLineWidth(0.8); doc.line(387, yy - 3, 409, yy - 3); doc.setFillColor(0, 0, 0); doc.triangle(413, yy - 3, 406, yy - 6, 406, yy, 'F'); };
  y += 16;
  const usd = isUsd(q);
  T('TOTAL', 359, y, { b: 1, s: 11, al: 'right' }); arrow(y); T(sym(q) + (usd ? ' ' : ' ') + fmt(totalCents(q)), R, y, { b: 1, al: 'right' });
  if (q.especial != null) { y += 15; T('P. ESPECIAL', 359, y, { b: 1, s: 11, al: 'right' }); arrow(y); T(sym(q) + ' ' + fmt(q.especial), R, y, { b: 1, al: 'right' }); }
  if (usd) { y += 15; arrow(y); T('R$ ' + fmt(toBrl(q, finalCents(q))), R, y, { b: 1, al: 'right' }); }
  y += 28;
  T('VALIDADE DA PROPOSTA:', L, y, { b: 1 }); T(br(addDays(q.data, q.dias)), 264, y, { b: 1 });
  y += 27; T('OBSERVAÇÃO:', L, y, { b: 1 }); T(isUsd(q) ? 'MATERIAL COTADO EM DÓLAR' : 'MATERIAL COTADO EM REAIS', 138, y, { b: 1 });
  y += 27; T('A VISTA VALOR LÍQUIDO', 138, y, { b: 1 });
  const { prazo, dep } = entregaTexts(q.entrega);
  y += 26;
  if (prazo) {
    font(true); doc.setFontSize(9);
    const lines = doc.splitTextToSize('PRAZO DE ENTREGA: ' + prazo, 262);
    T(lines, 273, y, { b: 1, al: 'center' }); y += (lines.length - 1) * LH;
  }
  y += 28;
  T('QUALQUER DÚVIDA COM RELAÇÃO A ESTA COTAÇÃO CONTACTAR VIA E-MAIL OU VIA', L, y, { b: 1 });
  const fones = [S.fone1, S.fone2].map(x => String(x || '').trim()).filter(Boolean);
  if (fones.length) { y += 15; T('FONE WHATSAPP FONE ' + fones.join(' OU '), L, y, { b: 1 }); }
  y += 25;
  const bank = [];
  if (up(S.banco)) bank.push('BANCO ' + up(S.banco));
  if (up(S.agencia)) bank.push('AGENCIA ' + up(S.agencia));
  if (up(S.conta)) bank.push('C/CORRENTE ' + up(S.conta));
  if (up(S.doc)) bank.push((String(S.doc).replace(/\D/g, '').length > 11 ? 'CNPJ.: ' : 'CPF.: ') + up(S.doc));
  if (up(S.titular)) bank.push(up(S.titular));
  bank.forEach(l => { T(l, L, y, { b: 1 }); y += 12; });
  y += 20;
  T('R$ ' + fmt(toBrl(q, finalCents(q))), 159, y, { b: 1, s: 9.5 }); T(dep, 227, y, { b: 1, s: 9.5 });
  if (up(S.assinatura)) { y += 29; T(up(S.assinatura), 296, y, { b: 1, s: 11, al: 'center' }); }
  return doc.output('blob');
}

/* ---------- estado de telas ---------- */
const STEPS = ['cliente', 'contato', 'dados', 'aeronave', 'moeda', 'itens', 'preco', 'entrega', 'datas', 'conferir'];
let V = { name: 'home' }, CUR = null, FC = false, E = null, PDF = null, LISTSEL = '';

function goto(name, extra) { V = Object.assign({ name }, extra || {}); if (STEPS.includes(name) && Q) { Q._step = name; saveDraft(); } render(); }
function nextStep() { if (FC) { FC = false; return goto('conferir'); } goto(STEPS[STEPS.indexOf(V.name) + 1]); }
function prevStep() { if (FC) { FC = false; return goto('conferir'); } const i = STEPS.indexOf(V.name); if (i <= 0) return goto('home'); goto(STEPS[i - 1]); }

function render() {
  CUR = SCREENS[V.name]();
  $('#title').textContent = CUR.title;
  const idx = STEPS.indexOf(V.name);
  const prog = $('#prog');
  if (idx >= 0) { prog.style.display = 'block'; $('#progt').textContent = `Passo ${idx + 1} de ${STEPS.length}`; $('#progb').style.width = ((idx + 1) / STEPS.length * 100) + '%'; }
  else prog.style.display = 'none';
  $('#view').innerHTML = CUR.html;
  if (CUR.bind) CUR.bind();
  refreshNav();
  window.scrollTo(0, 0);
}
function refreshNav() {
  const sc = CUR; let h = '';
  const msg = sc.next && sc.valid ? sc.valid() : '';
  $('#hint').textContent = msg;
  if (sc.back) h += `<button class="btn" data-a="navback">${esc(sc.backLabel || 'Voltar')}</button>`;
  if (sc.next) h += `<button class="btn pri" data-a="navnext" ${msg ? 'disabled' : ''}>${esc(sc.nextLabel || 'Continuar')}</button>`;
  $('#nav').innerHTML = h;
  $('#navwrap').style.display = h ? 'block' : 'none';
}

/* ---------- campos ---------- */
function setField(f, val) {
  const [obj, key] = f.split('.');
  if (obj === 'E') E[key] = val;
  else if (obj === 'cfg') { DB.settings[key] = val; saveDB(); }
  else if (obj === 'ent') { Q.entrega[key] = val; saveDraft(); }
  else if (obj === 'cli') { Q.cli = Q.cli || {}; Q.cli[key] = key === 'uf' ? String(val).toUpperCase() : val; saveDraft(); }
  else { Q[obj] = val; if (obj === 'cliente') { const c = findClient(val); Q.att = c ? (c.att || '') : ''; Q.cli = cliOf(c); } saveDraft(); }
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f_cat') { renderCatList(); return; }
  if (!t.dataset.f) return;
  setField(t.dataset.f, t.type === 'checkbox' ? t.checked : t.value);
  if (t.dataset.f === 'cliente') renderClientList();
  if (t.dataset.f.startsWith('E.')) updateLive();
  if (t.dataset.f === 'ptaxTxt') ptaxEx();
  if (t.dataset.f === 'data') { const o = $('#valdate'); if (o) o.textContent = br(addDays(Q.data, Q.dias)); }
  refreshNav();
});

/* ---------- telas ---------- */
const findClient = n => DB.clients.find(c => up(c.nome) === up(n));
const cliOf = c => { const o = {}; CLI_KEYS.forEach(k => { o[k] = c && c[k] ? c[k] : ''; }); return o; };
const clientRecent = () => DB.clients.slice().sort((a, b) => (b.last || 0) - (a.last || 0));
function renderClientList() {
  const box = $('#clist'); if (!box) return;
  const q = up(Q.cliente);
  const list = clientRecent().filter(c => !q || up(c.nome).includes(q)).slice(0, 8);
  box.innerHTML = list.length ? list.map(c => `<button class="btn" data-a="pickcli" data-n="${esc(c.nome)}">${esc(c.nome)}${c.att ? `<small>A/C: ${esc(c.att)}</small>` : ''}</button>`).join('') : '<p class="muted">Nenhum cliente salvo com esse nome. Pode continuar: ele será salvo ao gerar a cotação.</p>';
}
const catPrice = c => isUsd(Q) ? c.unitUsd : c.unit;

        <button class="btn" data-a="exp" data-k="clients">Exportar clientes (planilha)</button>
        <button class="btn" data-a="exp" data-k="catalog">Exportar itens (planilha)</button>
        <button class="btn" data-a="backup">Fazer backup (salvar arquivo)</button>
        <button class="btn" data-a="restore">Carregar arquivo de dados / backup</button>
        <p class="muted">O backup guarda tudo (clientes, itens, cotações e configurações). Guarde o arquivo em local seguro, como o Google Drive.</p>` };
  },
  lista() {
    const k = V.k, arr = DB[k];
    const rows = arr.map((x, i) => k === 'clients'
      ? `<div class="card"><b>${esc(x.nome)}</b>${x.att ? `<div class="muted">A/C: ${esc(x.att)}</div>` : ''}${CLI_KEYS.filter(k => x[k]).map(k => `<div class="muted">${esc(CLI_LBL[k])}: ${esc(x[k])}</div>`).join('')}<button class="btn sm danger" data-a="dellist" data-i="${i}">Apagar</button></div>`
      : `<div class="card"><b>${esc(x.nome)}</b><div class="muted">P/N ${esc(x.pn || '-')} • ${x.unit ? 'R$ ' + fmt(x.unit) : ''}${x.unit && x.unitUsd ? ' • ' : ''}${x.unitUsd ? 'US$ ' + fmt(x.unitUsd) : ''}</div><button class="btn sm danger" data-a="dellist" data-i="${i}">Apagar</button></div>`).join('');
    return { title: k === 'clients' ? 'Clientes salvos' : 'Itens salvos', back: () => goto('config'), html: `<h2>${k === 'clients' ? 'Clientes salvos' : 'Itens salvos'}</h2>${rows || '<p class="muted">Nada salvo ainda.</p>'}` };
  }
};

/* ---------- ações ---------- */
function saveItem() {
  const it = { qtd: parseBR(E.qtd), pn: up(E.pn), nome: up(E.nome), unit: toCents(E.unit) };
  if (V.idx == null) Q.itens.push(it); else Q.itens[V.idx] = it;
  saveDraft(); goto('itens');
}
function startItem(i) {
  const it = i == null ? null : Q.itens[i];
  E = it ? { qtd: String(it.qtd).replace('.', ','), pn: it.pn, nome: it.nome, unit: fmt(it.unit) } : { qtd: '1', pn: '', nome: '', unit: '' };
  goto('item', { idx: i });
}
async function gerar() {
  const q = JSON.parse(JSON.stringify(Q));
  q.especial = q.espOn ? toCents(q.espTxt) : null;
  const cli = q.cli || {};
  if (q.moeda === 'USD') q.ptax = rateOf(Q); else { q.moeda = 'BRL'; delete q.ptax; }
  delete q.espOn; delete q.espTxt; delete q._step; delete q.cli; delete q.ptaxTxt; delete q.ptaxInfo;
  const isFix = !!q.numero;
  const yr = q.data.slice(0, 4);
  if (!isFix) { q.numero = (DB.counters[yr] || 0) + 1; q.ano = +yr; }
  q.criadaEm = q.criadaEm || Date.now();
  $('#nav').innerHTML = '<div class="btn" style="text-align:center">Gerando o PDF…</div>';
  let blob;
  try { blob = await buildPdf(q); }
  catch (e) { console.error(e); toast('Não foi possível gerar o PDF. Tente de novo.'); refreshNav(); return; }
  if (!isFix) DB.counters[yr] = q.numero;
  const i = DB.history.findIndex(h => h.id === q.id);
  if (i >= 0) DB.history[i] = q; else DB.history.push(q);
  const now = Date.now();
  let c = findClient(q.cliente);
  if (!c) { c = { nome: up(q.cliente) }; DB.clients.push(c); }
  c.att = up(q.att); c.last = now;
  const diffs = [];
  CLI_KEYS.forEach(k => {
    const nv = String(cli[k] || '').trim(), ov = String(c[k] || '').trim();
    if (!nv || nv === ov) return;
    if (!ov) c[k] = nv; else diffs.push([k, ov, nv]);
  });
  if (diffs.length) {
    const ok = await askYN('Os dados de <b>' + esc(c.nome) + '</b> mudaram:<br><br>' + diffs.map(d => esc(CLI_LBL[d[0]]) + ': <s>' + esc(d[1]) + '</s> → <b>' + esc(d[2]) + '</b>').join('<br>') + '<br><br><b>Atualizar o cadastro?</b>');
    if (ok) diffs.forEach(d => { c[d[0]] = d[2]; });
  }
  q.itens.forEach(it => {
    const k = DB.catalog.find(x => (it.pn && up(x.pn) === it.pn) || (!it.pn && !x.pn && up(x.nome) === it.nome));
    const f = q.moeda === 'USD' ? 'unitUsd' : 'unit';
    if (k) { k.nome = it.nome; k[f] = it.unit; } else { const n = { pn: it.pn, nome: it.nome }; n[f] = it.unit; DB.catalog.push(n); }
  });
  saveDB(); clearDraft();
  setPdf(q, blob); goto('pronto');
}
function setPdf(q, blob) {
  if (PDF && PDF.url) URL.revokeObjectURL(PDF.url);
  PDF = { q, blob, url: URL.createObjectURL(blob), name: `Cotacao_${String(q.numero).padStart(3, '0')}-${q.ano}_${slug(q.cliente)}.pdf` };
}
function downloadPdf() { const a = document.createElement('a'); a.href = PDF.url; a.download = PDF.name; document.body.appendChild(a); a.click(); a.remove(); }
async function sharePdf() {
  const file = new File([PDF.blob], PDF.name, { type: 'application/pdf' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Cotação ' + numTxt(PDF.q), text: 'Cotação ' + numTxt(PDF.q) });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  downloadPdf();
  toast('O PDF foi salvo. Abra o WhatsApp e anexe o arquivo na conversa.');
}
function cloneToDraft(h, keepNumber) {
  const q = JSON.parse(JSON.stringify(h));
  q.espOn = q.especial != null; q.espTxt = q.especial != null ? fmt(q.especial) : '';
  q.moeda = q.moeda || 'BRL'; q.ptaxTxt = q.ptax ? String(q.ptax).replace('.', ',') : ''; q.ptaxInfo = ''; q.cli = cliOf(findClient(q.cliente));
  if (!keepNumber) { q.id = uid(); q.numero = null; q.ano = null; q.data = todayISO(); q.dias = +DB.settings.validade || 14; delete q.criadaEm; }
  q._step = 'conferir'; Q = q; saveDraft(); FC = false; goto('conferir');
}
function download(name, text, type) { const b = new Blob([text], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }

function askYN(html) {
  return new Promise(res => {
    const w = document.createElement('div');
    w.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;display:flex;align-items:center;justify-content:center;padding:1rem';
    w.innerHTML = '<div style="background:#fff;color:#111;border-radius:14px;padding:1.2rem;max-width:30rem;width:100%;max-height:90vh;overflow:auto"><div style="margin-bottom:1rem">' + html + '</div><div class="row"><button class="btn pri" data-yn="1">SIM</button><button class="btn" data-yn="0">NÃO</button></div></div>';
    w.addEventListener('click', e => { const b = e.target.closest('[data-yn]'); if (b) { w.remove(); res(b.dataset.yn === '1'); } });
    document.body.appendChild(w);
  });
}
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const usDate = iso => { const [y, m, d] = iso.split('-'); return m + '-' + d + '-' + y; };
async function ptaxFetch() {
  const info = () => { const el = $('#ptaxinfo'); if (el) el.textContent = Q.ptaxInfo || ''; };
  Q.ptaxInfo = 'Buscando a PTAX de compra no Banco Central…'; info();
  try {
    let end = validISO(Q.data) ? Q.data : todayISO(); if (end > todayISO()) end = todayISO();
    const ini = addDays(end, -10);
    const url = "https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarPeriodo(dataInicial=@di,dataFinal=@df)?@di='" + usDate(ini) + "'&@df='" + usDate(end) + "'&$orderby=dataHoraCotacao%20desc&$top=50&$format=json&$select=cotacaoCompra,dataHoraCotacao";
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(url, { signal: ctl.signal }); clearTimeout(tm);
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json(); const v = j.value && j.value[0];
    if (!v || !(v.cotacaoCompra > 0)) throw new Error('vazio');
    Q.ptaxTxt = String(v.cotacaoCompra.toFixed(4)).replace('.', ',');
    Q.ptaxInfo = 'Sugerida: PTAX de compra do Banco Central de ' + br(v.dataHoraCotacao.slice(0, 10)) + ' (último boletim). Você pode alterar.';
  } catch (e) {
    console.log('PTAX erro', e && e.message);
    Q.ptaxInfo = 'Não foi possível buscar agora (sem internet?). Digite a cotação do dólar.';
  }
  saveDraft();
  if (V.name === 'moeda') { const i = $('#f_ptax'); if (i) i.value = Q.ptaxTxt; info(); ptaxEx(); refreshNav(); }
}
function ptaxEx() { const el = $('#ptaxex'); if (el) { const r = rateOf(Q); el.textContent = isNaN(r) ? '-' : brl(Math.round(100000 * r)); } }
function ptaxStep(d) { const r = rateOf(Q); const b = isNaN(r) ? 0 : r; Q.ptaxTxt = (Math.max(0.01, Math.round((b + d) * 10000) / 10000)).toFixed(4).replace('.', ','); saveDraft(); const i = $('#f_ptax'); if (i) i.value = Q.ptaxTxt; ptaxEx(); refreshNav(); }
function csvOf(k) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const n = c => c ? (c / 100).toFixed(2).replace('.', ',') : '';
  let rows;
  if (k === 'clients') rows = [['Nome', 'A/C', 'Rua e número', 'CEP', 'Cidade', 'UF', 'País', 'Telefone', 'CPF/CNPJ', 'E-mail']].concat(DB.clients.map(c => [c.nome, c.att, c.end, c.cep, c.cidade, c.uf, c.pais, c.fone, c.doc, c.email]));
  else rows = [['P/N', 'Nome', 'Preço R$', 'Preço US$']].concat(DB.catalog.map(c => [c.pn, c.nome, n(c.unit), n(c.unitUsd)]));
  return '\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n');
}
const ACT = {
  moeda(d) { Q.moeda = d.v; saveDraft(); render(); },
  ptaxbuscar() { ptaxFetch(); },
  ptaxm() { ptaxStep(-0.01); }, ptaxp() { ptaxStep(0.01); },
  skipdados() { nextStep(); },
  async cep() {
    const c = String((Q.cli || {}).cep || '').replace(/\D/g, '');
    if (c.length !== 8) { toast('Digite o CEP com 8 números.'); return; }
    try {
      const r = await fetch('https://viacep.com.br/ws/' + c + '/json/'); const j = await r.json();
      if (j.erro) { toast('CEP não encontrado.'); return; }
      Q.cli.end = Q.cli.end || [j.logradouro, j.bairro].filter(Boolean).join(', ');
      Q.cli.cidade = j.localidade || Q.cli.cidade; Q.cli.uf = j.uf || Q.cli.uf; Q.cli.pais = Q.cli.pais || 'BRASIL';
      saveDraft(); render(); toast('Endereço preenchido. Confira e complete o número.');
    } catch (e) { toast('Não foi possível buscar o CEP agora. Digite o endereço.'); }
  },
  exp(d) { download((d.k === 'clients' ? 'clientes_' : 'itens_') + todayISO() + '.csv', csvOf(d.k), 'text/csv;charset=utf-8'); toast('Planilha salva. Abra no Excel ou Google Planilhas.'); },
  fs() { DB.ui.fs = (DB.ui.fs + 1) % 4; applyFs(); saveDB(); },
  navback() { CUR.back && CUR.back(); },
  navnext() { if (CUR.valid && CUR.valid()) return; CUR.next && CUR.next(); },
  new(d) { if (Q && (Q.cliente || Q.itens.length) && !confirm('Já existe uma cotação em andamento. Descartar e começar uma nova?')) return; Q = blankQuote(); saveDraft(); FC = false; goto('cliente'); },
  resume() { FC = false; goto(Q._step && STEPS.includes(Q._step) ? Q._step : 'cliente'); },
  discard() { if (confirm('Descartar a cotação em andamento?')) { clearDraft(); goto('home'); } },
  hist() { goto('hist'); }, home() { goto('home'); }, config() { goto('config'); },
  pickcli(d) { const c = DB.clients.find(c => c.nome === d.n); Q.cliente = d.n; Q.att = c ? (c.att || '') : ''; Q.cli = cliOf(c); saveDraft(); nextStep(); },
  useatt(d) { Q.att = d.v; saveDraft(); nextStep(); },
  skipatt() { Q.att = ''; saveDraft(); nextStep(); },
  useae(d) { Q.aeronave = d.v; saveDraft(); nextStep(); },
  skipae() { Q.aeronave = ''; saveDraft(); nextStep(); },
  additem() { startItem(null); },
  edititem(d) { startItem(+d.i); },
  delitem(d) { if (confirm('Remover este item?')) { Q.itens.splice(+d.i, 1); saveDraft(); render(); } },
  pickcat(d) { const c = DB.catalog.find(c => c.pn === d.pn && c.nome === d.nm); if (!c) return; E.pn = c.pn; E.nome = c.nome; E.unit = catPrice(c) ? fmt(catPrice(c)) : ''; $('#e_p').value = E.pn; $('#e_n').value = E.nome; $('#e_u').value = E.unit; $('#f_cat').value = ''; renderCatList(); updateLive(); refreshNav(); },
  espon() { Q.espOn = true; saveDraft(); render(); setTimeout(() => { const e = $('#f_esp'); e && e.focus(); }, 50); },
  espoff() { Q.espOn = false; saveDraft(); render(); },
  tipo(d) { Q.entrega.tipo = d.v; saveDraft(); render(); },
  envm() { Q.entrega.envios = Math.max(1, (parseInt(Q.entrega.envios, 10) || 1) - 1); saveDraft(); render(); },
  envp() { Q.entrega.envios = Math.min(20, (parseInt(Q.entrega.envios, 10) || 1) + 1); saveDraft(); render(); },
  frete(d) { Q.entrega.fretePago = d.v === '1'; saveDraft(); render(); },
  usetr(d) { Q.entrega.transp = d.v; saveDraft(); render(); },
  diam() { Q.dias = Math.max(1, Q.dias - 1); saveDraft(); $('#dias').textContent = Q.dias + ' dias'; $('#valdate').textContent = br(addDays(Q.data, Q.dias)); },
  diap() { Q.dias = Math.min(365, Q.dias + 1); saveDraft(); $('#dias').textContent = Q.dias + ' dias'; $('#valdate').textContent = br(addDays(Q.data, Q.dias)); },
  alt(d) { FC = true; goto(d.s); },
  share() { sharePdf(); },
  viewpdf() { window.open(PDF.url, '_blank'); },
  savepdf() { downloadPdf(); },
  fixq() { cloneToDraft(PDF.q, true); },
  detail(d) { goto('detail', { id: d.id }); },
  async regen(d) { const h = DB.history.find(x => x.id === d.id); try { setPdf(h, await buildPdf(h)); goto('pronto'); } catch (e) { toast('Não foi possível gerar o PDF.'); } },
  clone(d) { if (Q && (Q.cliente || Q.itens.length) && !confirm('Já existe uma cotação em andamento. Descartar e usar esta como base?')) return; cloneToDraft(DB.history.find(x => x.id === d.id), false); },
  fixhist(d) { if (Q && (Q.cliente || Q.itens.length) && !confirm('Já existe uma cotação em andamento. Descartar e abrir esta?')) return; cloneToDraft(DB.history.find(x => x.id === d.id), true); },
  delhist(d) { if (confirm('Apagar esta cotação do histórico? Isso não pode ser desfeito.')) { DB.history = DB.history.filter(x => x.id !== d.id); saveDB(); goto('hist'); } },
  lista(d) { goto('lista', { k: d.k }); },
  dellist(d) { if (confirm('Apagar este registro?')) { DB[V.k].splice(+d.i, 1); saveDB(); render(); } },
  backup() { download('backup_cotacoes_' + todayISO() + '.json', JSON.stringify(Object.assign({}, DB, { _app: 'cotacoes', _v: 2 })), 'application/json'); toast('Backup salvo. Guarde o arquivo em local seguro.'); },
  restore() { $('#filepick').value = ''; $('#filepick').click(); }
};
document.addEventListener('click', e => {
  $('#toast').style.display = 'none';
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.a]; if (f) f(b.dataset);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.aChange === 'counter') {
    const yr = String(new Date().getFullYear()); const n = parseInt(t.value, 10);
    if (!isNaN(n) && n >= 0) { DB.counters[yr] = n; saveDB(); toast('Numeração atualizada. A próxima será ' + (n + 1) + '/' + yr + '.'); }
  }
});
$('#filepick').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const x = JSON.parse(fr.result);
      if (!x || typeof x !== 'object' || !('settings' in x || 'history' in x || 'clients' in x)) throw new Error('formato');
      if (!confirm('Carregar este arquivo? Os dados atuais deste aparelho serão substituídos.')) return;
      const ui = DB.ui; DB = normDB(x); DB.ui = ui; saveDB(); toast('Dados carregados com sucesso.'); goto('config');
    } catch (err) { toast('Este arquivo não parece ser um backup válido.'); }
  };
  fr.readAsText(f);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file') { e.preventDefault(); e.target.blur(); } });

const FS = [18, 20, 23, 26];
function applyFs() { document.documentElement.style.setProperty('--fs', FS[DB.ui.fs % 4] + 'px'); }
applyFs();
if (Q && !Q.entrega) Q = null;
if (Q) { Q.moeda = Q.moeda || 'BRL'; Q.ptaxTxt = Q.ptaxTxt || ''; Q.cli = Q.cli || {}; }
window.__cot = { fmt, parseBR, toCents, buildPdf, entregaTexts, get DB() { return DB; }, normDB, setDB(x) { DB = normDB(x); saveDB(); } };
render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
